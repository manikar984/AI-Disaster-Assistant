
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - run: npm run build --prefix web -- --base=/AI-Disaster-Assistant/

      # The project-path base applies to this workflow only. The application
      # build used by FastAPI and the integration tests stays at the root path.
      - name: Verify project-path asset URLs
        run: |
          set -eu
          test -f web/dist/index.html
          grep -q 'src="/AI-Disaster-Assistant/assets/' web/dist/index.html
          grep -q 'href="/AI-Disaster-Assistant/assets/' web/dist/index.html
          ! grep -qE '(src|href)="/assets/' web/dist/index.html
          echo "GitHub Pages build references /AI-Disaster-Assistant/assets/ only."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
