name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip && pip install -r requirements.lock pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r requirements.lock
      - run: npm ci --prefix web && npm audit --prefix web && npm run build --prefix web
      - name: Browser integration smoke test (disposable database)
        env:
          DATABASE_PATH: /tmp/disaster-browser-ci.db
          USGS_ENABLED: 'false'
        run: |
          python -m backend.cli sample
          uvicorn backend.app:app --host 0.0.0.0 --port 8001 &
          API_PID=$!
          trap 'kill $API_PID' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('API did not start')
          PY
          npm run test:browser --prefix web
