name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip && pip install -r requirements.lock pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r requirements.lock
      - run: npm ci --prefix web && npm audit --prefix web && npm run build --prefix web
      - name: Browser integration smoke test (disposable database)
        env:
          DATABASE_PATH: /tmp/disaster-browser-ci.db
          USGS_ENABLED: 'false'
        run: bash .github/scripts/browser-smoke.sh

      - name: Static preview smoke test (built frontend, no backend)
        run: npm run test:static --prefix web

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
